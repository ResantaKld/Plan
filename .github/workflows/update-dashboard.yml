name: Update dashboard

on:
  schedule:
    - cron: "0 8 * * *"   # ежедневно 08:00 UTC = 10:00 по Калининграду
  workflow_dispatch:       # ручной запуск: Actions -> Update dashboard -> Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dashboard from Yandex Disk
        env:
          DISK_URL: ${{ vars.DISK_URL }}
        run: |
          set -e
          if [ -z "$DISK_URL" ]; then
            echo "::error::Переменная DISK_URL не задана. Настройте: Settings -> Secrets and variables -> Actions -> Variables -> New repository variable, Name = DISK_URL, Value = публичная ссылка на index.html (https://yadi.sk/d/GQn5fpGb06Cjcw)"
            exit 1
          fi

          # 1) Получаем прямую ссылку через официальный API Яндекса (короткая ссылка напрямую отдаёт роботам страницу антибота)
          HREF=""
          for i in 1 2 3 4 5; do
            CODE=$(curl -sL -G -o api.json -w "%{http_code}" "https://cloud-api.yandex.net/v1/disk/public/resources/download" --data-urlencode "public_key=$DISK_URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              HREF=$(python3 -c "import json;print(json.load(open('api.json')).get('href',''))" 2>/dev/null || echo "")
              if [ -n "$HREF" ]; then
                echo "Прямая ссылка получена (попытка $i)"
                break
              fi
              echo "API вернул 200, но без href. Ответ: $(head -c 200 api.json)"
            else
              BODY=$(head -c 200 api.json 2>/dev/null || echo "")
              echo "API попытка $i: HTTP $CODE ${BODY}"
            fi
            echo "Ждём $((i*15)) секунд..."
            sleep $((i*15))
          done
          if [ -z "$HREF" ]; then
            echo "::error::Не удалось получить прямую ссылку с Диска после 5 попыток. Если ошибка повторяется каждый день, пришлите этот лог."
            exit 1
          fi

          # 2) Скачиваем файл (с повторами)
          OK=0
          for i in 1 2 3; do
            if curl -sL --fail -o index.html "$HREF"; then OK=1; break; fi
            echo "Скачивание: попытка $i не удалась, ждём 20 секунд..."
            sleep 20
          done
          if [ "$OK" != "1" ]; then
            echo "::error::Скачивание не удалось после 3 попыток"
            exit 1
          fi

          # 3) Проверяем, что скачан именно дашборд
          SIZE=$(wc -c < index.html)
          if [ "$SIZE" -lt 100000 ] || ! grep -q "var CLIENTS" index.html; then
            echo "::error::Скачан не дашборд ($SIZE байт) — проверьте DISK_URL"
            exit 1
          fi
          echo "Скачан дашборд: $SIZE байт"

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Без изменений — коммит не нужен"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Обновление дашборда $(TZ=Europe/Kaliningrad date +'%d.%m.%Y')"
            git push
          fi
